<!DOCTYPE html>
<html lang="pt-BR" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Impulse">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Impulse Media</title>
<style>
:root{
  color-scheme:light;
  --bg:#F2F2F7; --cell:#FFFFFF; --sep:#C6C6C8; --label:#000000; --sec:#6C6C70; --ter:#AEAEB2;
  --fill:#E5E5EA; --fill2:#EFEFF4; --tint:#2F5FE0; --tintbg:#E7EDFC;
  --green:#34A853; --orange:#E08600; --red:#E5372B; --bar:rgba(249,249,251,.92); --sheet:#F2F2F7;
  --navy:#0E1A3D;
}
@media (prefers-color-scheme:dark){:root[data-theme=auto]{color-scheme:dark;
  --bg:#000000; --cell:#1C1C1E; --sep:#38383A; --label:#FFFFFF; --sec:#98989F; --ter:#5A5A5F;
  --fill:#2C2C2E; --fill2:#1C1C1E; --tint:#5B8BFF; --tintbg:#1A2850;
  --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --bar:rgba(22,22,24,.9); --sheet:#1C1C1E;}}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#000000; --cell:#1C1C1E; --sep:#38383A; --label:#FFFFFF; --sec:#98989F; --ter:#5A5A5F;
  --fill:#2C2C2E; --fill2:#1C1C1E; --tint:#5B8BFF; --tintbg:#1A2850;
  --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --bar:rgba(22,22,24,.9); --sheet:#1C1C1E;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--tint);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.page{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 6px) 0 calc(96px + env(safe-area-inset-bottom))}

/* nav */
.navrow{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px 0 16px}
.navrow .sp{flex:1}
.av{width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--navy);flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.nb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--tint);position:relative}
.nb svg{width:24px;height:24px}
.nb .bd{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.lt{font-size:34px;font-weight:700;letter-spacing:.2px;padding:2px 16px 0;line-height:1.15}
.ls{color:var(--sec);font-size:15px;padding:2px 16px 0}

/* groups */
.gh{display:flex;justify-content:space-between;align-items:baseline;padding:26px 16px 7px}
.gh h3{font-size:20px;font-weight:700;letter-spacing:.1px}
.gh h3 small{font-size:15px;font-weight:400;color:var(--sec);margin-left:4px}
.gh button{color:var(--tint);font-size:15px}
.cap{font-size:13px;color:var(--sec);padding:7px 32px 0;line-height:1.35}
.grp{background:var(--cell);border-radius:11px;margin:0 16px;overflow:hidden}
.c{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 0 0 16px;width:100%;text-align:left;position:relative}
.c:active{background:var(--fill)}
.c .bd2{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:10px 16px 10px 0;border-top:.5px solid var(--sep);align-self:stretch}
.grp>.c:first-child .bd2,.grp>div:first-child>.c .bd2{border-top:0}
.c .tx{flex:1;min-width:0}
.c .t{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .s{font-size:14px;color:var(--sec);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .r{color:var(--sec);font-size:16px;white-space:nowrap;text-align:right}
.c .r.red{color:var(--red)}.c .r.green{color:var(--green)}.c .r.orange{color:var(--orange)}.c .r.tint{color:var(--tint)}
.chev{width:8px;height:13px;flex:none;color:var(--ter)}
.ini{width:34px;height:34px;border-radius:50%;background:var(--fill);color:var(--sec);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.ico svg{width:18px;height:18px}
.empty{padding:13px 16px;color:var(--sec);font-size:15px}
.time{width:46px;font-size:15px;font-weight:600;flex:none}
.vline{width:3px;align-self:stretch;margin:8px 0;border-radius:2px;flex:none}

/* summary card */
.sum{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left}
.sum:active{background:var(--fill)}
.sum .big{font-size:28px;font-weight:700;letter-spacing:-.3px}
.sum .big span{font-size:17px;font-weight:400;color:var(--sec)}
.pbar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:8px;display:flex}
.pbar i{display:block;height:100%}

/* search + segmented */
.search{display:flex;align-items:center;gap:6px;margin:10px 16px 0;background:var(--fill2);border-radius:10px;padding:0 8px;height:36px;color:var(--sec)}
.search input{flex:1;border:0;background:none;outline:none;font-size:17px;color:var(--label)}
.search svg{width:16px;height:16px;flex:none}
.segc{display:flex;margin:12px 16px 0;background:var(--fill);border-radius:9px;padding:2px}
.segc button{flex:1;padding:6px 2px;border-radius:7px;font-size:13px;font-weight:500;white-space:nowrap}
.segc button.on{background:var(--cell);box-shadow:0 2px 6px rgba(0,0,0,.12);font-weight:600}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:520px;margin:0 auto;display:flex}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font-size:10px;font-weight:500;color:var(--ter)}
.tabs button svg{width:25px;height:25px}
.tabs button.on{color:var(--tint)}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 12px);z-index:41;max-width:520px;margin:0 auto;overflow-y:auto;background:var(--sheet);border-radius:12px 12px 0 0;padding-bottom:calc(30px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.3,.9,.3,1)}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.ov,.banner{transition:none}}
.sbar{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:54px;padding:0 16px;background:var(--sheet)}
.sbar .l{justify-self:start;color:var(--tint)}
.sbar .m{font-weight:600}
.sbar .rr{justify-self:end;color:var(--tint);font-weight:600}
.sbar .rr:disabled{color:var(--ter)}
.hero{text-align:center;padding:4px 16px 2px}
.hero .ini{width:64px;height:64px;font-size:24px;margin:0 auto 8px;background:var(--navy);color:#fff}
.hero h2{font-size:24px;font-weight:700}
.hero p{color:var(--sec);font-size:15px;margin-top:2px}

/* form cells */
.f{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border-top:.5px solid var(--sep);margin-left:0}
.grp>.f:first-child{border-top:0}
.f label{flex:none;font-size:17px}
.f input,.f select{flex:1;min-width:0;border:0;background:none;outline:none;text-align:right;font-size:17px;color:var(--sec);padding:11px 0;-webkit-appearance:none;appearance:none}
.f input.full{text-align:left;color:var(--label)}
.f input::placeholder{color:var(--ter)}
.f select{direction:rtl}
.f select option{direction:ltr}
.money-in:focus-visible{outline:none}.money-in{font-size:40px;font-weight:700;text-align:center;border:0;background:none;outline:none;width:100%;padding:8px 0 2px;color:var(--label)}
.money-cap{text-align:center;color:var(--sec);font-size:14px}

/* buttons */
.btn{display:block;width:calc(100% - 32px);margin:14px 16px 0;padding:14px;border-radius:12px;background:var(--tint);color:#fff;font-weight:600;font-size:17px;text-align:center}
.btn.gray{background:var(--fill);color:var(--tint)}
.btn.green{background:var(--green)}
.row2{display:flex;gap:10px;margin:14px 16px 0}.row2 .btn{margin:0;width:auto;flex:1}
.lnk{color:var(--tint)}
.danger{color:var(--red)}

/* posts */
.slots{display:flex;gap:8px;padding:14px 16px 4px;flex-wrap:wrap}
.slot{width:62px;height:62px;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:600;text-align:center}
.slot.d{background:var(--tint);color:#fff}
.slot.s{background:var(--tintbg);color:var(--tint)}
.slot.e{border:1.5px dashed var(--ter);color:var(--sec)}
.slot.ed{background:rgba(255,159,10,.16);color:var(--orange)}
.btn.orange{background:var(--orange);color:#fff}
.small-link{display:block;margin:6px auto 14px;color:var(--tint);font-size:15px}
.slot svg{width:22px;height:22px;display:block;margin:0 auto 2px}

/* reminders */
.ck{width:23px;height:23px;border-radius:50%;border:1.5px solid var(--ter);flex:none;display:grid;place-items:center}
.ck.on{border-color:var(--tint);background:var(--tint);color:#fff}
.done .t{color:var(--sec)}
.addrow{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:44px;color:var(--tint);border-top:.5px solid var(--sep)}
.grp>.addrow:first-child{border-top:0}
.addrow input{flex:1;border:0;background:none;outline:none;font-size:17px;color:var(--label);padding:11px 0}
.addrow input::placeholder{color:var(--tint)}
.plus{width:23px;height:23px;border-radius:50%;background:var(--tint);color:#fff;display:grid;place-items:center;flex:none}

/* week strip */
.wk{display:grid;grid-template-columns:repeat(7,1fr);padding:12px 8px 0;text-align:center}
.wk button{display:flex;flex-direction:column;align-items:center;gap:4px}
.wk .w{font-size:11px;color:var(--sec);font-weight:500}
.wk .d{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:19px}
.wk .today .d{color:var(--red);font-weight:600}
.wk .on .d{background:var(--label);color:var(--bg);font-weight:600}
.wk .on.today .d{background:var(--red);color:#fff}
.wk .dt{width:5px;height:5px;border-radius:50%;background:var(--ter)}

/* board */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.tile{background:var(--cell);border-radius:12px;padding:10px;text-align:left;min-height:88px;display:flex;flex-direction:column}
.tile:active{opacity:.7}
.tile .tn{font-size:13px;font-weight:600;line-height:1.2;flex:1}
.tile .st{font-size:12px;margin-top:6px;font-weight:500}
.ring{display:flex;gap:3px;margin-top:6px}
.ring i{flex:1;height:4px;border-radius:2px;background:var(--fill)}
.ring i.d{background:var(--tint)}.ring i.s{background:var(--tint);opacity:.4}

/* finance */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 16px 0}
.kpi{background:var(--cell);border-radius:11px;padding:12px 14px}
.kpi.wide{grid-column:span 2}
.kpi .l{font-size:14px;color:var(--sec)}
.kpi .v{font-size:22px;font-weight:700;margin-top:3px;letter-spacing:-.2px}
.kpi.wide .v{font-size:34px}
.kpi .n{font-size:13px;color:var(--sec);margin-top:2px}
.chart{background:var(--cell);border-radius:11px;margin:0 16px;padding:14px 12px 10px}
.chart svg{width:100%;height:auto;display:block}
.leg{display:flex;gap:14px;font-size:13px;color:var(--sec);padding:6px 4px 0}
.leg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c);vertical-align:-1px}
.catbar{height:6px;border-radius:3px;background:var(--fill);margin-top:6px;overflow:hidden}
.catbar i{display:block;height:100%;border-radius:3px}
.mon{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px;font-weight:600}
.mon button{color:var(--tint);width:32px;height:32px;display:grid;place-items:center}
.mon button:disabled{color:var(--ter)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.chip{display:flex;align-items:center;gap:6px;padding:7px 12px 7px 7px;border-radius:18px;background:var(--cell);font-size:15px}
.chip .ico{width:24px;height:24px;border-radius:6px}
.chip .ico svg{width:14px;height:14px}
.chip.on{box-shadow:inset 0 0 0 2px var(--tint)}

/* switch */
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.sw.on{background:#34C759}.sw.on::after{left:22px}

/* banner */
.banner{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translate(-50%,-160%);z-index:60;width:calc(100% - 16px);max-width:500px;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:20px;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 10px 30px rgba(0,0,0,.18);transition:transform .4s cubic-bezier(.2,.9,.3,1.05)}
.banner.on{transform:translate(-50%,0)}
.banner img{width:38px;height:38px;border-radius:9px;object-fit:cover;background:var(--navy)}
.banner>div{flex:1;min-width:0}
.banner .a{display:flex;justify-content:space-between;font-size:13px;color:var(--sec)}
.banner .a b{color:var(--label);font-weight:600}
.banner .b{font-size:15px;font-weight:600;margin-top:1px}
.banner .cc{font-size:15px}
.note{font-size:12px;color:var(--ter);text-align:center;padding:22px 16px 0}

/* login + extras */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:40px 0 60px;max-width:420px;margin:0 auto}
.login .logo{width:84px;height:84px;border-radius:20px;overflow:hidden;margin:0 auto 14px;background:var(--navy)}
.login .logo img{width:100%;height:100%}
.login h1{text-align:center;font-size:28px;font-weight:700}
.login p{text-align:center;color:var(--sec);font-size:15px;margin:4px 16px 22px}
.err{color:var(--red);font-size:14px;text-align:center;padding:10px 16px 0;min-height:20px}
.demo-bar{background:var(--orange);color:#fff;font-size:12.5px;font-weight:600;text-align:center;padding:5px 10px;padding-top:calc(env(safe-area-inset-top) + 5px)}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--sec);font-size:15px}
.btn:disabled{opacity:.5}
.c .r .num{font-variant-numeric:tabular-nums}
.f textarea{flex:1;border:0;background:none;outline:none;font-size:17px;padding:11px 0;resize:none;color:var(--label)}
.week-nav{display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px}
.week-nav span{display:flex}.week-nav button{color:var(--tint);width:40px;height:40px;display:grid;place-items:center;font-size:24px}
.week-nav .lt{padding:0}


/* fluxo gravação > edição > postagem */
.slot.pr{background:rgba(52,199,89,.16);color:var(--green)}
.btn.teal{background:#30B0C7;color:#fff}
.funnel{display:flex;align-items:center;margin:8px 16px 0;background:var(--cell);border-radius:14px;padding:14px 8px}
.funnel div{flex:1;text-align:center}
.funnel b{display:block;font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.funnel span{font-size:12.5px;color:var(--sec)}
.funnel i{color:var(--ter);font-style:normal;font-size:18px}
.stock{margin:12px 16px 0;border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:12px;background:rgba(52,199,89,.13)}
.stock .bx{width:44px;height:44px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.stock b{font-size:16px;display:block}.stock span{font-size:13.5px;color:var(--sec)}
.stock.zero{background:var(--fill)}.stock.zero .bx{background:var(--ter)}
.step{display:flex;align-items:center;justify-content:space-between;padding:26px 16px 7px}
.step h3{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.step h3 em{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff}
.step small{font-size:15px;color:var(--sec)}
.vis{display:flex;align-items:center;gap:14px;padding:11px 16px;border-top:.5px solid var(--sep);width:100%;text-align:left}
.grp>.vis:first-child{border-top:0}
.vis .dt{width:46px;flex:none;text-align:center;border-radius:10px;background:var(--fill);padding:6px 0 5px}
.vis .dt b{display:block;font-size:20px;font-weight:700;line-height:1}
.vis .dt span{font-size:11px;color:var(--sec)}
.vis .tx b{font-size:16px;font-weight:600}.vis .tx p{font-size:13.5px;color:var(--sec);margin-top:1px}
.vis .n{margin-left:auto;font-size:15px;font-weight:600;color:var(--tint);white-space:nowrap}
.rhero{margin:6px 16px 0;background:#0E1A3D;color:#fff;border-radius:16px;padding:18px 18px 14px}
.rhero .top{display:flex;align-items:center;gap:10px}
.rhero .top img{width:34px;height:34px;border-radius:9px}
.rhero .top b{font-size:17px;font-weight:700;display:block}.rhero .top span{font-size:13px;color:#9FB0D6}
.rnums{display:grid;grid-template-columns:repeat(4,1fr);margin-top:12px}
.rnums div{text-align:center;padding:4px 0}.rnums div+div{border-left:1px solid rgba(255,255,255,.12)}
.rnums b{display:block;font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1.1}.rnums span{font-size:12px;color:#9FB0D6}
.rhero .mo{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12)}
.rhero .mo button{color:#9FC0FF;font-size:22px;width:34px;height:30px}.rhero .mo button:disabled{opacity:.25}
.rhero .mo span{font-size:15px;font-weight:600}
.wk2{padding:12px 16px;border-top:.5px solid var(--sep)}.grp>.wk2:first-child{border-top:0}
.wk2 .l{display:flex;justify-content:space-between;font-size:15px}.wk2 .l span{color:var(--sec)}
.wk2 .bar{display:flex;gap:4px;margin-top:8px}.wk2 .bar i{flex:1;height:7px;border-radius:4px;background:var(--fill)}.wk2 .bar i.on{background:var(--tint)}
/* abertura animada */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:radial-gradient(ellipse at 50% 42%,#0b1749 0%,#050a26 45%,#01010d 80%);transition:opacity .55s ease,transform .7s cubic-bezier(.3,0,.2,1);cursor:pointer;overflow:hidden}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
#splash img{display:block;mix-blend-mode:lighten;user-select:none;-webkit-user-drag:none}
#splash .sym img{-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 70%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 70%,transparent 100%)}
#splash .wm,#splash .md{-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent),linear-gradient(transparent,#000 15%,#000 85%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent),linear-gradient(transparent,#000 15%,#000 85%,transparent);mask-composite:intersect}
#splash .sym{position:relative;width:min(62vw,300px)}
#splash .sym img{width:100%;opacity:0;transform:scale(.62) rotate(-14deg);filter:blur(14px) brightness(.4);animation:symIn 1.1s cubic-bezier(.2,.9,.25,1) .15s forwards}
#splash .sym::after{content:"";position:absolute;inset:-10% -40%;background:linear-gradient(105deg,transparent 40%,rgba(190,220,255,.55) 50%,transparent 60%);mix-blend-mode:overlay;transform:translateX(-120%);animation:shine 1s ease-in-out 1.05s forwards;pointer-events:none}
#splash .glow{position:absolute;left:50%;top:50%;width:70%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.4);background:radial-gradient(circle,rgba(70,140,255,.45),transparent 65%);opacity:0;animation:glow 1.6s ease-out .5s forwards;pointer-events:none}
#splash .star{position:absolute;left:94%;top:37%;width:26px;height:26px;transform:translate(-50%,-50%) scale(0);opacity:0;background:radial-gradient(circle,#fff 0 12%,rgba(160,200,255,.8) 20%,transparent 60%);animation:star .9s ease-out 1.5s forwards;pointer-events:none}
#splash .star::before,#splash .star::after{content:"";position:absolute;left:50%;top:50%;width:300%;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);transform:translate(-50%,-50%)}
#splash .star::after{transform:translate(-50%,-50%) rotate(90deg)}
#splash .wm{width:min(78vw,380px);opacity:0;clip-path:inset(0 50% 0 50%);animation:wm .8s cubic-bezier(.3,.8,.3,1) .95s forwards}
#splash .md{width:min(78vw,380px);opacity:0;transform:translateY(8px);animation:md .6s ease-out 1.45s forwards;letter-spacing:0}
@keyframes symIn{60%{filter:blur(0) brightness(1.25)}to{opacity:1;transform:none;filter:none}}
@keyframes shine{to{transform:translateX(120%)}}
@keyframes glow{30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}to{opacity:.35;transform:translate(-50%,-50%) scale(1.25)}}
@keyframes star{40%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(45deg)}to{opacity:.85;transform:translate(-50%,-50%) scale(.8) rotate(90deg)}}
@keyframes wm{to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes md{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash *,#splash *::after{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div id="splash" onclick="hideSplash()" aria-hidden="true"><div class="sym"><span class="glow"></span><img src="icons/splash-simbolo.jpg" alt=""><span class="star"></span></div><img class="wm" src="icons/splash-impulse.jpg" alt=""><img class="md" src="icons/splash-media.jpg" alt=""></div>
<script>
var __splashT0=Date.now();
function hideSplash(){var s=document.getElementById('splash');if(!s||s.classList.contains('out'))return;s.classList.add('out');setTimeout(function(){s.remove();},750);}
window.__splashDone=function(){var wait=Math.max(0,2600-(Date.now()-__splashT0));setTimeout(hideSplash,wait);};
setTimeout(hideSplash,6000);
</script>
